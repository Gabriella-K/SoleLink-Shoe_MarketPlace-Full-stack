spring.application.name=shoemarketplacesystembackend

# --- Server -------------------------------------------------------------
# Hosting platforms inject PORT; locally it falls back to 8080.
server.port=${PORT:8080}

# --- Database (set these as environment variables, never commit passwords) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shoe_marketplace_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- App ---------------------------------------------------------------
# Comma-separated list of browser origins allowed to call the API directly.
app.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
